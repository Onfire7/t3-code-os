name: image

# A v* tag publishes that image version. The weekly run rebuilds the latest
# release under the same tags, picking up Debian patches; Maître's
# `catalog outdated` notices the new digest.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/t3-code-os

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the version to build
        id: ref
        run: |
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)"
            [ -n "$tag" ] && git checkout "$tag"
          elif [ "${{ github.ref_type }}" = tag ]; then
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag:-}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.ref.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.ref.outputs.tag != '' }}
            type=semver,pattern={{major}},value=${{ steps.ref.outputs.tag }},enable=${{ steps.ref.outputs.tag != '' }}
            type=sha,enable=${{ steps.ref.outputs.tag == '' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && steps.ref.outputs.tag != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
